[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medai"
version = "0.1.0"
description = "Shared preprocessing, models and explainability for the AI-assisted imaging capstone"
requires-python = ">=3.10"
dependencies = ["numpy", "pydicom>=2.4", "pillow", "torch>=2.2", "torchvision>=0.17"]

[project.optional-dependencies]
train = ["monai>=1.3", "nibabel", "pandas", "scikit-learn", "pyyaml", "tqdm", "matplotlib", "dvc"]

[tool.setuptools]
packages = ["medai"]
