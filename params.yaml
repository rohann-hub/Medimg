# Every tunable number lives here. DVC tracks this file, so changing a value
# marks the affected stages as stale and `dvc repro` re-runs only those.

prepare:
  raw_dir: data/raw/rsna            # Kaggle RSNA Pneumonia Detection Challenge download
  out_dir: data/processed/rsna
  image_size: 512                   # stored PNG side (training resizes again)
  limit: 0                          # 0 = all ~26.7k images; e.g. 3000 for a laptop dry run
  val_frac: 0.15
  test_frac: 0.15
  seed: 42

train_cls:
  arch: densenet121                 # densenet121 | efficientnet_b0 | efficientnet_b3
  pretrained: true                  # ImageNet weights (transfer learning)
  image_size: 320
  batch_size: 16
  epochs: 12
  lr: 0.0003
  weight_decay: 0.0001
  freeze_backbone_epochs: 1         # warm up the new head before unfreezing everything
  early_stop_patience: 3
  target_sensitivity: 0.90          # threshold is picked on VAL to hit this (screening use)
  num_workers: 4
  seed: 42

train_seg:
  data_dir: data/raw/msd            # MONAI downloads Task09_Spleen here (~1.5 GB)
  roi_size: [96, 96, 96]
  max_epochs: 300
  val_interval: 5
  lr: 0.0001
  cache_rate: 1.0                   # lower to 0.3 if you run out of RAM
  num_workers: 4
  seed: 42
